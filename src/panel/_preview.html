<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>闪投 · 本地预览</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>

<header class="topbar">
  <h1>闪投</h1>
  <button id="btn-back" class="icon-btn" title="返回条件设置" hidden>‹ 条件</button>
  <button id="btn-menu" class="icon-btn" title="更多">⋯</button>
</header>

<div class="menu" id="menu" hidden>
  <button data-act="reload-dict">重新读取 BOSS 筛选项</button>
  <button data-act="export">导出全部数据</button>
</div>

<!-- ══════════════ 条件设置 ══════════════ -->
<div class="screen on" id="screen-config">

  <section class="sec">
    <h2>图片版简历</h2>
    <div class="uploads" id="uploads"></div>
    <input type="file" id="file-input" accept="image/*" multiple hidden>
    <div class="ocr-row" id="ocr-row" hidden>
      <span id="ocr-status"></span>
      <button class="link" id="btn-toggle-text">查看识别文字</button>
    </div>
    <textarea id="resume-text" rows="8" hidden></textarea>
  </section>

  <section class="sec">
    <h2>目标公司 <span class="h-note">只投这些公司</span></h2>
    <div class="search">
      <input type="text" id="company-search" placeholder="搜索公司…">
      <span class="clear" data-clear="company-search">×</span>
    </div>
    <div id="company-groups"></div>
    <div class="picked-wrap" id="company-picked" hidden>
      <div class="picked-label">已选公司</div>
      <div class="chips" id="company-selected"></div>
    </div>
    <div class="note">不选公司也能搜，那就是按岗位词全网搜索。</div>
  </section>

  <section class="sec">
    <h2>目标城市</h2>
    <div class="search">
      <input type="text" id="city-search" placeholder="搜索城市…">
      <span class="clear" data-clear="city-search">×</span>
    </div>
    <div class="pills" id="city-quick"></div>
    <button class="link-more" id="btn-city-more">展开更多</button>
    <div class="picked-wrap" id="city-picked" hidden>
      <div class="picked-label">已选城市</div>
      <div class="chips" id="city-selected"></div>
    </div>
  </section>

  <section class="sec">
    <h2>期望职位</h2>
    <div class="search">
      <input type="text" id="position-search" placeholder="搜索岗位…">
      <span class="clear" data-clear="position-search">×</span>
    </div>
    <div id="position-result"></div>
    <div class="picked-wrap" id="position-picked" hidden>
      <div class="picked-label">已选岗位</div>
      <div class="chips" id="position-selected"></div>
    </div>
  </section>

  <div id="filter-area"></div>

</div>

<!-- ══════════════ 搜索与结果 ══════════════ -->
<div class="screen" id="screen-result">
  <div class="progress" id="search-progress" hidden>
    <div class="progress-phase" id="search-phase"></div>
    <div class="progress-bar"><div class="progress-fill" id="search-fill"></div></div>
    <div class="progress-detail" id="search-detail"></div>
  </div>
  <div id="funnel" class="funnel" hidden></div>
  <div class="list-head" id="list-head" hidden>
    <span id="select-count"></span>
    <span class="list-actions">
      <button class="link" data-sel="all">全选</button>
      <button class="link" data-sel="none">全不选</button>
    </span>
  </div>
  <div id="job-list"></div>
  <div class="empty" id="search-empty" hidden></div>
</div>

<!-- ══════════════ 打招呼语 ══════════════ -->
<div class="screen" id="screen-greeting">
  <div class="progress" id="greet-progress" hidden>
    <div class="progress-phase" id="greet-phase"></div>
    <div class="progress-bar"><div class="progress-fill" id="greet-fill"></div></div>
    <div class="progress-detail" id="greet-detail"></div>
  </div>
  <div id="greet-list"></div>
</div>

<!-- ══════════════ 投递 ══════════════ -->
<div class="screen" id="screen-send">
  <div class="progress" id="send-progress">
    <div class="progress-phase" id="send-phase"></div>
    <div class="progress-bar"><div class="progress-fill" id="send-fill"></div></div>
    <div class="progress-detail" id="send-detail"></div>
  </div>
  <div id="send-log" class="send-log"></div>
</div>

<footer class="actionbar">
  <div class="action-hint" id="action-hint"></div>
  <div class="action-row">
    <button id="btn-reset" class="btn ghost">重置</button>
    <button id="btn-action" class="btn primary">开始搜索</button>
  </div>
</footer>

<div id="toast" class="toast" hidden></div>

<script src="../shared/constants.js"></script>
<script src="../shared/utils.js"></script>
<script src="../data/companies.js"></script>
<script src="../data/positions.js"></script>
<script src="panel.js"></script>
</body>
</html>
